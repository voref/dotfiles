# ============================================================
# Plugins (managed by TPM - prefix + I to install, prefix + U to update)
# ============================================================
set -g @plugin 'tmux-plugins/tpm'                     # plugin manager itself
set -g @plugin 'catppuccin/tmux'                      # catppuccin color theme for status bar/borders
set -g @plugin 'tmux-plugins/tmux-yank'               # copy tmux selections to the system clipboard
set -g @plugin 'christoomey/vim-tmux-navigator'       # pane navigation between tmux and vim/nvim splits

# auto-install TPM itself on a fresh machine, then install the plugins above
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# ============================================================
# Status bar (Catppuccin theme)
# ============================================================
set -g @catppuccin_flavor "macchiato"                                  # catppuccin color flavor
set -g @catppuccin_status_background "#{@thm_bg}"                      # status bar background color

set -g @catppuccin_window_status_style "rounded"                       # window tab shape
set -g @catppuccin_window_current_text " #W"                           # active tab label: window name (rename with prefix + ,)
set -g @catppuccin_window_text " #W"                                   # inactive tab label: same, for consistency

set -g @catppuccin_status_connect_separator "no"                       # plugin default "yes" hides the cap above by never resetting bg between modules
set -g @catppuccin_status_right_separator ""                          # rounded cap (mirror of  used by @catppuccin_window_status_style "rounded")

set -g status-position top                                             # draw the status bar above the panes instead of below
set -g status-left-length 100                                          # max width reserved for status-left
set -g status-left ""                                                  # nothing on the left side of the bar
set -g status-right-length 100                                         # max width reserved for status-right
set -g status-right "#{E:@catppuccin_status_session}"                  # right side shows only the session module

setw -g pane-border-status top                                         # native border row at the top of each pane, right under the status bar
setw -g pane-border-format ""                                          # empty format -> just a line, no pane title text
setw -g pane-border-style "fg=#{@thm_surface_0},bg=#{@thm_bg}"         # inactive pane border color, matches status bar bg
setw -g pane-active-border-style "fg=#{@thm_overlay_0},bg=#{@thm_bg}"  # active pane border color

# ============================================================
# General behavior
# ============================================================
unbind C-b                                            # remove the default prefix (Ctrl-b)
set -g prefix C-Space                                 # set the new prefix to Ctrl-Space
set -g mouse on                                       # enable mouse: click to select pane, drag to resize, scroll for history
set -g default-terminal "tmux-256color"               # advertise 256-color terminal capability to programs inside tmux
set -sa terminal-overrides "xterm*:Tc"                # enable true 24-bit color passthrough for xterm-like terminals
set -s escape-time 10                                 # shrink the delay after Esc so it doesn't lag inside vim/nvim
set -g history-limit 50000                            # scrollback buffer size per pane, in lines
set -g base-index 1                                   # windows start numbering at 1 instead of 0
set -g pane-base-index 1                              # panes start numbering at 1 instead of 0
set -g renumber-windows on                            # keep window numbers contiguous after closing one
setw -g monitor-activity on                           # flag windows with activity (shown via window-status-activity-style)
setw -g mode-keys vi                                  # use vi-style keys in copy mode (v to select, y to yank, etc.)

# ============================================================
# Key bindings
# ============================================================
bind '"' split-window -v -c "#{pane_current_path}"    # new pane below, same working directory
bind % split-window -h -c "#{pane_current_path}"      # new pane to the right, same working directory

# vim-tmux-navigator: Ctrl-h/j/k/l move between tmux panes and vim/nvim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"                   # true if the active pane is running (n)vim
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'                # move left, or forward the key to vim
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'                # move down, or forward the key to vim
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'                # move up, or forward the key to vim
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'                # move right, or forward the key to vim
bind-key -n 'C-\' if-shell "$is_vim" "send-keys 'C-\\'" 'select-pane -l'            # jump to the previously active pane/split

# ============================================================
# Initialize TPM (must stay the very last line in this file)
# ============================================================
run '~/.tmux/plugins/tpm/tpm'
